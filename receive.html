<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080809"><title>声浪 · 手机接收</title><link rel="stylesheet" href="./assets/qr-receive.css?v=8"><script defer src="./assets/qr-transfer.js?v=8"></script></head><body id="qrReceive"><main><header><h1>接收测试记录</h1><p>用 Safari 或 Chrome 打开，允许相机，对准车机连续数据码。无需访问上传后端。</p></header><video id="qrVideo" muted playsinline aria-label="二维码取景画面"></video><div class="camera-actions"><button id="qrCameraStart">打开相机</button><button id="qrCameraStop" disabled>暂停</button></div><p id="qrReceiveStatus" role="status">正在恢复接收进度…</p><progress id="qrReceiveProgress" value="0" max="1"></progress><div id="qrReceiveCount">0 / 0 帧</div><p id="qrMissing"></p><section id="qrReceiveResult" hidden><h2>完整性校验通过</h2><p id="qrResultDetails"></p><div class="camera-actions"><a id="qrDownload" download>保存 JSON</a><button id="qrShare" hidden>分享文件</button></div><p>保存后可通过微信或其他方式发送 JSON 文件，供后续分析调校。</p></section><details><summary>相机无法使用 / 从录像接收</summary><p>可先用手机相机录下车机完整一轮数据码，再在这里选择录像。漏帧时可继续选择下一轮录像补齐。当前接收进度保存在本机，刷新后可继续。</p><input id="qrVideoFile" type="file" accept="video/*" aria-label="选择二维码录像"></details><button id="qrReceiveClear" class="secondary">清空手机接收缓存</button><p class="note">仅清空手机接收缓存，不会删除车机记录。接收前无需输入 GitHub Token 或上传密码。</p></main></body></html>
